name: Deploy Web to GitHub Pages

# Baut die Flutter-Web-Version der App und veröffentlicht sie bei jedem Push
# auf main unter https://efftobi.github.io/tafel-krefeld-app/.
# Bei Pull Requests läuft nur die Validierung (analyze + test + build),
# ohne Deployment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Erlaubt das manuelle Auslösen über den Actions-Tab.
  workflow_dispatch:

# Rechte, die actions/deploy-pages und die OIDC-Verifizierung benötigen.
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Lauf pro Ref gleichzeitig; laufende werden nicht abgebrochen, damit
# ein Pages-Deployment nicht mittendrin abbricht.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Analyze, Test & Build Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Abhängigkeiten installieren
        run: flutter pub get

      - name: Statische Analyse
        # Reine Infos (z. B. prefer_const_constructors) sollen den Deploy nicht
        # blockieren; Warnungen und Fehler lassen den Build weiterhin scheitern.
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Web bauen
        run: flutter build web --release --base-href /tafel-krefeld-app/

      # Ab hier nur bei Push auf main / manuellem Lauf — bei Pull Requests wird
      # nichts deployt (und die Pages-Rechte stehen dort ggf. nicht zur Verfügung).
      - name: GitHub Pages konfigurieren
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          # Aktiviert GitHub Pages automatisch, falls in den Repo-Settings noch
          # nicht geschehen. Schlägt fehl, wenn die Actions-Berechtigung fehlt —
          # dann einmalig unter Settings → Pages → Source: GitHub Actions setzen.
          enablement: true

      - name: Build-Artefakt hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    name: Deploy to GitHub Pages
    # Nur bei Push auf main / manuellem Lauf deployen, nicht bei Pull Requests.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
